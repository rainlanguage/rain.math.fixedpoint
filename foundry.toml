[profile.default]
libs = ["dependencies"]
# See more config options https://github.com/foundry-rs/foundry/tree/master/config

solc = "0.8.25"
optimizer = true
optimizer_runs = 100000

evm_version = "cancun"

fuzz.runs = 1024

[dependencies]
forge-std = "1.17.0"
"@openzeppelin-contracts" = "5.7.0"
"rain-math-saturating" = "0.1.10"
"rain-string" = "0.3.9"

[soldeer]
recursive_deps = false
